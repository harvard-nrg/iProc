[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "iProc"
version = "v2.6.1"
dependencies = [
    "nibabel == 5.3.3",
    "texttable == 0.8.4",
    "paramiko == 3.3.1",
    "numpy == 1.25.2",
    "scipy == 1.16.3",
    "matplotlib == 3.10.8",
    "PyYAML == 5.2",
    "yaxil == 0.13.1",
    "configparser == 3.5.0"
]
requires-python = ">= 3.9"

[project.scripts]
"iProc.py" = "iproc.cli.iproc:main"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material"
]

[tool.hatch.build.targets.sdist]
include = ["iproc/**"]

[tool.hatch.build.targets.wheel]
packages = ["iproc"]

[project.urls]
Repository = "https://github.com/harvard-nrg/iProc"
Documentation = "https://harvard-nrg.github.io/iProc"

